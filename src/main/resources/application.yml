spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/job_aggregator
    username: job_aggregator
    password: changeme
    driver-class-name: org.postgresql.Driver

  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: true

