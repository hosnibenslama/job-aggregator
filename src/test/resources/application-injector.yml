spring:
  cloud:
    vault:
      enabled: false
      kv:
        enabled: false
  config:
    import: ""
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  batch:
    jdbc:
      initialize-schema: embedded

  sql:
    init:
      mode: always
      schema-locations: classpath:test-schema.sql
      data-locations: []

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

contract:
  import:
    input-file: classpath:visa-premier.txt
    invalid-file: target/test-invalid-contracts.txt
    charset: UTF-8

logging:
  level:
    org.springframework.batch: WARN
    com.bnpparibas.dsibddf.ap23992.modeldevente.batch.injector: DEBUG
